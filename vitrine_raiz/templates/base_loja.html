<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="Loja Ibix - Compre com segurança. Sistema de vendas e gestão.">
    <meta name="theme-color" content="#2c3e50">
    <title>{% block title %}Loja{% endblock %} | Ibix</title>
    <link rel="shortcut icon" href="/static/img/arte-pdv.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700&display=swap" rel="stylesheet">
    <link href="/static/css/dashboard.css" rel="stylesheet">
    <link href="/static/css/certipeso.css" rel="stylesheet">
    <link href="/static/css/landing/header.css" rel="stylesheet">
    <link href="/static/css/loja.css?v=42" rel="stylesheet">
    <style>
        body { font-family: "DM Sans", system-ui, -apple-system, sans-serif; color: var(--certipeso-dark, #2c3e50); min-height: 100vh; display: flex; flex-direction: column; }
        body.loja-page { background: linear-gradient(160deg, var(--certipeso-light, #ecf0f1) 0%, #e2e8eb 50%, #f0f4f6 100%); }
        body:not(.loja-page) { background: var(--bs-gray-100, #f8f9fa); }
        main { flex: 1; }
        /* Cabeçalho: tipografia própria (DM Sans), não cópia Amazon */
        .loja-header { font-family: "DM Sans", system-ui, -apple-system, sans-serif; }
        .loja-header.cp-navbar .loja-nav-belt { min-height: 80px; display: flex; align-items: center; flex-wrap: wrap; gap: 0.75rem 1rem; justify-content: space-between; }
        .loja-header .container { padding-left: 0; padding-right: 0; }
        .loja-nav-left { display: flex; align-items: center; flex-shrink: 0; }
        .loja-nav-fill { flex: 1; min-width: 0; max-width: 480px; display: flex; justify-content: center; margin: 0 1rem; }
        .loja-nav-right { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0; flex-wrap: wrap; }
        .loja-header .loja-brand { font-weight: 700; letter-spacing: .2px; color: var(--cp-primary, var(--certipeso-primary, #2c3e50)); text-decoration: none; font-size: 1.05rem; display: inline-flex; align-items: center; gap: 0.5rem; }
        .loja-header .loja-brand:hover { color: var(--cp-secondary, var(--certipeso-secondary, #34495e)); }
        .loja-header .loja-brand img { height: 64px; width: auto; object-fit: contain; }
        .loja-brand-tag { font-weight: 600; color: #6b7280; font-size: 0.9rem; margin-left: 0.25rem; text-decoration: none; }
        .loja-brand-tag:hover { color: var(--cp-secondary, var(--certipeso-secondary, #34495e)); }
        /* Busca original: apenas campo + botão (sem dropdown departamentos) */
        .loja-search-form { display: flex; width: 100%; max-width: 100%; border: 1px solid #d1d5db; border-radius: 8px; overflow: hidden; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.05); }
        .loja-search-form .form-control { flex: 1; min-width: 0; border: none; border-radius: 0; padding: 0.5rem 1rem; font-size: 0.9375rem; }
        .loja-search-form .form-control:focus { box-shadow: none; outline: none; }
        .loja-search-form .btn-search { border: none; border-left: 1px solid #e5e7eb; background: var(--certipeso-primary, #2c3e50); color: #fff; padding: 0.5rem 1rem; min-width: 48px; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; }
        .loja-search-form .btn-search .feather { width: 1.125rem; height: 1.125rem; }
        .loja-search-form .btn-search:hover { background: var(--certipeso-secondary, #34495e); color: #fff; }
        .loja-nav-item { color: #1f2937; text-decoration: none; padding: 0.35rem 0.5rem; border-radius: 4px; display: flex; flex-direction: column; align-items: flex-start; line-height: 1.2; }
        .loja-nav-item:hover { color: var(--certipeso-primary, #2c3e50); }
        .loja-nav-line1 { font-size: 0.75rem; color: #6b7280; }
        .loja-nav-line2 { font-size: 0.875rem; font-weight: 600; }
        .loja-nav-cart .loja-cart-count { background: var(--certipeso-primary); color: #fff; font-size: 0.7rem; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 50%; display: inline-flex; align-items: center; justify-content: center; margin-right: 2px; }
        .loja-nav-item .feather, .loja-btn-icon .feather { width: 1.25rem; height: 1.25rem; }
        .loja-nav-item.loja-nav-icon { flex-direction: row; align-items: center; gap: 0.35rem; }
        .loja-nav-item.loja-nav-icon .loja-nav-line2 { font-size: 0.8125rem; }
        /* Rodapé no mesmo formato da landing (cp-footer) */
        .cp-footer { border-top: 1px solid rgba(0,0,0,.08); background: #fff; padding: 18px 0; color: #6b7280; font-size: .9rem; }
        .cp-footer a { color: #6b7280; text-decoration: none; }
        .cp-footer a:hover { color: var(--cp-primary, var(--certipeso-primary, #2c3e50)); }
        .cp-footer .cp-credits { font-size: .85rem; }
        .cp-footer .cp-logo { height: 36px; width: auto; vertical-align: middle; object-fit: contain; }
        @media (max-width: 768px) { .loja-nav-fill { order: 3; max-width: 100%; width: 100%; } }
    </style>
    {% block head_extra %}{% endblock %}
</head>
<body class="loja-page">
    <header class="cp-navbar loja-header">
        <div class="container py-3">
            <div class="loja-nav-belt">
                <div class="loja-nav-left">
                    <div class="loja-brand">
                        <a href="{{ base_url|default('/', true) }}" style="display: inline-flex; align-items: center; gap: 0.5rem; color: inherit; text-decoration: none;">
                            <img src="/static/img/landing/logoSfundo.png" alt="Ibix" onerror="this.style.display='none'">
                            <span>Ibix</span>
                        </a>
                        <a class="loja-brand-tag" href="https://www.ibix.com.br/login" target="_blank" rel="noopener noreferrer" title="Acesso lojista — login Ibix">Loja</a>
                    </div>
                </div>
                <div class="loja-nav-fill">
                    <form class="loja-search-form" action="/loja/busca" method="get" role="search">
                        <input type="search" class="form-control" name="q" id="loja-header-busca-q" placeholder="Buscar produtos..." value="{{ busca_q|default('', true) }}" aria-label="Buscar produtos">
                        <button type="submit" class="btn btn-search" title="Buscar" aria-label="Buscar"><i data-feather="search"></i></button>
                    </form>
                </div>
                <div class="loja-nav-right">
                    <a class="loja-nav-item loja-nav-cart loja-nav-icon" href="/loja/carrinho" title="Carrinho" aria-label="Carrinho">
                        <span id="loja-cart-count" class="loja-cart-count" style="display: none;">0</span>
                        <i data-feather="shopping-cart"></i>
                    </a>
                    <a class="loja-nav-item loja-nav-icon" href="{% if consumidor_logado %}/loja/minha-conta{% else %}/loja/login{% endif %}" title="{% if consumidor_logado %}Minha conta{% else %}Entrar{% endif %}" aria-label="{% if consumidor_logado %}Minha conta{% else %}Entrar{% endif %}">
                        <i data-feather="user"></i>
                    </a>
                    {% if consumidor_logado %}
                    <a class="loja-nav-item loja-nav-icon" href="/loja/logout" title="Sair" aria-label="Sair"><i data-feather="log-out"></i><span class="loja-nav-line2">Sair</span></a>
                    {% endif %}
                </div>
            </div>
        </div>
    </header>
    <main class="container-fluid py-4 loja-main">
        {% block content %}{% endblock %}
    </main>
    <footer class="cp-footer">
        <div class="container d-flex flex-wrap align-items-center justify-content-between gap-2">
            <div class="d-flex flex-wrap align-items-center gap-2">
                <img src="/static/img/landing/logoSfundo.png" alt="Ibix" class="cp-logo" style="height: 36px; width: auto;">
                <span>Ibix</span>
                <span aria-hidden="true">·</span>
                <span class="cp-credits">Desenvolvido por <a href="https://automscale.com.br" target="_blank" rel="noopener noreferrer"><strong>Automscale</strong></a></span>
            </div>
            <div class="d-flex align-items-center gap-2">
                <a href="/">Início</a>
                <span aria-hidden="true">·</span>
                <a href="/termos-de-uso">Termos de Uso</a>
                <span aria-hidden="true">·</span>
                <a href="/politica-privacidade">Política de Privacidade</a>
                <span aria-hidden="true">·</span>
                <a href="/como-funciona-vitrine">Como funciona a vitrine</a>
                <span aria-hidden="true">·</span>
                <span>&copy; 2022</span>
            </div>
        </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/feather-icons/dist/feather.min.js" crossorigin="anonymous"></script>
    <script src="/static/js/vitrine.js?v=20"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        if (typeof feather !== 'undefined' && feather.replace) feather.replace();
    });
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>

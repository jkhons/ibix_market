# PDV SOLUMATICA - Configuração pytest
[pytest]
testpaths = tests
pythonpath = .
addopts = -v --tb=short
filterwarnings =
    ignore::DeprecationWarning
    ignore::pydantic.PydanticDeprecatedSince20
markers =
    refactor_home: testes da home refatorada (Fase 1 vitrine). Rodar com: pytest -m refactor_home

[project]
name = "pdv-solumatica"
version = "0.0.0"
description = "PDV / negócios — Ibix"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
target-version = "py313"
line-length = 120
src = ["app"]
exclude = [
    ".venv",
    ".git",
    "uploads",
    "htmlcov",
    "__pycache__",
]

[tool.ruff.lint]
# E4/E7/E9: pycodestyle “crítico” sem E501 (comprimento de linha) nem E71x (SQLAlchemy)
select = ["E4", "E7", "E9", "F", "I"]
ignore = [
    "E712",
    "E711",
    "E722",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
# Registro de modelos ORM para rotas HTML / lifespan
"main.py" = ["F403", "F405"]
[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

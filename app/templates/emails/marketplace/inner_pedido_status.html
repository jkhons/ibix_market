<h1 style="margin:0 0 12px;font-size:22px;font-weight:700;color:#0f172a;line-height:1.25;">{{headline}}</h1>
<p style="margin:0 0 16px;font-size:16px;color:#334155;line-height:1.55;">Olá, <strong>{{comprador_primeiro_nome}}</strong> — {{lead}}</p>
<table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background:#f1f5f9;border-radius:12px;margin:16px 0;">
  <tr>
    <td style="padding:18px 20px;">
      <p style="margin:0 0 6px;font-size:12px;text-transform:uppercase;letter-spacing:0.06em;color:#64748b;">Situação atual</p>
      <p style="margin:0;font-size:17px;font-weight:700;color:{{cor_vitrine}};">{{status_label}}</p>
      <p style="margin:12px 0 0;font-size:14px;color:#475569;">Pedido <strong>{{numero_pedido}}</strong></p>
    </td>
  </tr>
</table>
{{bloco_itens_pedido}}
<p style="margin:16px 0 0;font-size:14px;color:#475569;line-height:1.55;">{{detail}}</p>

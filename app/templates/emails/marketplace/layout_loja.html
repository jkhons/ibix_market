<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{titulo_email}}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f6f9;font-family:'Segoe UI',Roboto,Helvetica,Arial,sans-serif;-webkit-font-smoothing:antialiased;">
  <span style="display:none!important;visibility:hidden;opacity:0;color:transparent;height:0;width:0;max-height:0;max-width:0;overflow:hidden;mso-hide:all;">{{preheader}}</span>
  <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="background-color:#f4f6f9;">
    <tr>
      <td align="center" style="padding:24px 12px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0" width="100%" style="max-width:620px;background:#ffffff;border-radius:16px;overflow:hidden;box-shadow:0 4px 24px rgba(15,23,42,0.08);border:1px solid rgba(0,0,0,0.06);">
          <tr>
            <td style="background:#0f172a;padding:20px 24px;text-align:left;">
              <p style="margin:0;font-size:12px;text-transform:uppercase;letter-spacing:0.08em;color:#94a3b8;">Painel da loja</p>
              <p style="margin:4px 0 0;font-size:18px;font-weight:700;color:#ffffff;line-height:1.3;">{{nome_plataforma}} — Marketplace</p>
            </td>
          </tr>
          <tr>
            <td style="padding:28px 28px 8px;">
              {{CONTENT_BLOCK}}
            </td>
          </tr>
          <tr>
            <td style="padding:8px 28px 28px;text-align:center;">
              <a href="{{link_painel_pedido}}" style="display:inline-block;padding:14px 28px;background:#0f172a;color:#ffffff!important;text-decoration:none;font-weight:700;font-size:15px;border-radius:999px;">Abrir pedido no painel</a>
              <p style="margin:14px 0 0;font-size:12px;color:#64748b;line-height:1.5;">Loja: <strong style="color:#0f172a;">{{nome_loja}}</strong></p>
            </td>
          </tr>
          <tr>
            <td style="padding:18px 28px;background:#f8fafc;border-top:1px solid #e2e8f0;">
              <p style="margin:0;font-size:11px;color:#94a3b8;line-height:1.5;">{{texto_rodape_loja}}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>

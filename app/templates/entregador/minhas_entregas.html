{% extends "entregador/base_entregador.html" %}
{% block title %}Minhas entregas{% endblock %}
{% block content %}
<h2>Minhas entregas</h2>
<p><a href="/entregas/disponiveis" class="btn-secondary">Ver disponíveis</a></p>
<div id="lista-entregas"></div>
<p id="msg-vazia" style="display:none;">Você não tem entregas.</p>
{% endblock %}
{% block scripts %}
<script>
(function() {
    var token = document.cookie.replace(/(?:(?:^|.*;\s*)entregador_token\s*=\s*([^;]*).*$)|^.*$/, "$1");
    if (!token) { window.location.href = "/entregas"; return; }
    fetch("/api/v1/entregador/minhas-entregas", { headers: { "Authorization": "Bearer " + token } })
        .then(function(r) {
            if (r.status === 401) { window.location.href = "/entregas"; return []; }
            return r.json();
        })
        .then(function(lista) {
            var el = document.getElementById("lista-entregas");
            var msg = document.getElementById("msg-vazia");
            if (!lista || lista.length === 0) { msg.style.display = "block"; return; }
            lista.forEach(function(e) {
                var card = document.createElement("div");
                card.className = "entregador-card";
                card.innerHTML = "<h3>Entrega #" + e.id + " – Pedido #" + e.pedido_id + "</h3>" +
                    "<p><span class=\"badge badge-secondary\">" + (e.status || "") + "</span> Frete: R$ " + (e.valor_frete != null ? Number(e.valor_frete).toFixed(2) : "0,00") + "</p>" +
                    "<a href=\"/entregas/entrega/" + e.id + "\" class=\"btn-primary\">Ver detalhe</a>";
                el.appendChild(card);
            });
        });
})();
</script>
{% endblock %}

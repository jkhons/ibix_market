{% extends "base.html" %}

{% block title %}Detalhe do tenant | {{ brand.nome_exibicao|default('PDV', true) }}{% endblock %}

{% block content %}
<div class="container-fluid p-0">
    <div class="mb-3">
        <a href="/admin/billing/tenants" class="btn btn-outline-secondary btn-sm me-2">&larr; Voltar</a>
        <h1 class="h3 d-inline align-middle">Tenant <span id="tenant-nome">#{{ tenant_id }}</span></h1>
    </div>

    <div id="loading" class="text-muted">Carregando...</div>
    <div id="content" class="d-none">
        <div class="card mb-4">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h5 class="card-title mb-0">Assinatura</h5>
                <div>
                    <button type="button" class="btn btn-sm btn-primary me-1" id="btn-cobranca">Gerar cobrança</button>
                    <button type="button" class="btn btn-sm btn-warning me-1" id="btn-block">Bloquear</button>
                    <button type="button" class="btn btn-sm btn-success" id="btn-unblock">Desbloquear</button>
                </div>
            </div>
            <div class="card-body">
                <div id="sub-info"></div>
                <div class="mt-3 pt-3 border-top" id="pdvs-limite-block">
                    <label class="form-label fw-bold">Limite de PDVs</label>
                    <div class="d-flex flex-wrap align-items-center gap-2">
                        <span id="pdvs-info-text"></span>
                        <input type="number" id="pdvs-limite-input" min="1" class="form-control form-control-sm" style="width: 80px;" />
                        <button type="button" class="btn btn-sm btn-outline-primary" id="btn-salvar-limite-pdvs">Salvar limite</button>
                    </div>
                    <small class="text-muted" id="pdvs-limite-msg"></small>
                </div>
            </div>
        </div>
        <div class="card">
            <div class="card-header"><h5 class="card-title mb-0">Pagamentos</h5></div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-sm">
                        <thead><tr><th>ID</th><th>MP Payment ID</th><th>Status</th><th>Valor</th><th>Pago em</th></tr></thead>
                        <tbody id="payments-body"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>
    <div id="error" class="text-danger d-none"></div>
</div>

<script>
(function() {
    var tenantId = {{ tenant_id }};
    function getToken() {
        var m = document.cookie.match(/\bpdv_automscale_token=([^;]*)/);
        return m ? m[1] : '';
    }
    function authHeaders() {
        return { 'Authorization': 'Bearer ' + getToken(), 'Accept': 'application/json', 'Content-Type': 'application/json' };
    }
    function load() {
        fetch('/api/v1/admin/billing/tenant/' + tenantId, { headers: authHeaders() })
            .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
            .then(function(data) {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('error').classList.add('d-none');
                document.getElementById('content').classList.remove('d-none');
                document.getElementById('tenant-nome').textContent = data.tenant_nome || ('#' + tenantId);
                var sub = data.subscription;
                var subHtml = sub ? ('Status: ' + sub.status + ' | Vencimento: ' + (sub.period_end || '-') + ' | Próxima cobrança: ' + (sub.next_charge_at || '-') + ' | Carência: ' + (sub.grace_days || '-') + ' dias' + (sub.valor_mensal_centavos != null ? ' | Valor: R$ ' + (sub.valor_mensal_centavos / 100).toFixed(2) : '')) : 'Sem assinatura';
                document.getElementById('sub-info').innerHTML = subHtml;
                var qtd = sub && sub.qtd_pdvs_contratados != null ? sub.qtd_pdvs_contratados : 1;
                var emUso = sub && sub.pdvs_em_uso != null ? sub.pdvs_em_uso : 0;
                document.getElementById('pdvs-info-text').textContent = 'PDVs contratados: ' + qtd + ' | PDVs em uso: ' + emUso + ' — ';
                var inputEl = document.getElementById('pdvs-limite-input');
                if (inputEl) { inputEl.value = qtd; inputEl.min = Math.max(1, emUso); }
                document.getElementById('pdvs-limite-msg').textContent = '';
                var payments = data.payments || [];
                document.getElementById('payments-body').innerHTML = payments.map(function(p) {
                    var paid = p.paid_at ? new Date(p.paid_at).toLocaleString('pt-BR') : '-';
                    return '<tr><td>' + p.id + '</td><td>' + p.mp_payment_id + '</td><td>' + p.status + '</td><td>R$ ' + (p.amount_centavos / 100).toFixed(2) + '</td><td>' + paid + '</td></tr>';
                }).join('') || '<tr><td colspan="5">Nenhum pagamento</td></tr>';
            })
            .catch(function(e) {
                document.getElementById('loading').classList.add('d-none');
                document.getElementById('error').textContent = 'Erro: ' + e.message;
                document.getElementById('error').classList.remove('d-none');
            });
    }
    document.getElementById('btn-cobranca').addEventListener('click', function() {
        fetch('/api/v1/admin/billing/tenant/' + tenantId + '/create-charge', { method: 'POST', headers: authHeaders() })
            .then(function(r) { return r.json(); })
            .then(function(d) { if (d.init_point) window.open(d.init_point); });
    });
    document.getElementById('btn-block').addEventListener('click', function() {
        if (!confirm('Bloquear este tenant?')) return;
        fetch('/api/v1/admin/billing/tenant/' + tenantId + '/block', { method: 'POST', headers: authHeaders() }).then(function() { load(); });
    });
    document.getElementById('btn-unblock').addEventListener('click', function() {
        fetch('/api/v1/admin/billing/tenant/' + tenantId + '/unblock', { method: 'POST', headers: authHeaders() }).then(function() { load(); });
    });
    document.getElementById('btn-salvar-limite-pdvs').addEventListener('click', function() {
        var inputEl = document.getElementById('pdvs-limite-input');
        var msgEl = document.getElementById('pdvs-limite-msg');
        var val = parseInt(inputEl.value, 10);
        if (!Number.isFinite(val) || val < 1) { msgEl.textContent = 'Informe um número maior ou igual a 1.'; msgEl.className = 'text-danger'; return; }
        msgEl.textContent = 'Salvando...'; msgEl.className = 'text-muted';
        fetch('/api/v1/admin/billing/tenant/' + tenantId + '/limite-pdvs', {
            method: 'PATCH',
            headers: authHeaders(),
            body: JSON.stringify({ qtd_pdvs_contratados: val })
        }).then(function(r) {
            if (r.ok) { msgEl.textContent = 'Limite atualizado.'; msgEl.className = 'text-success'; load(); }
            else { return r.json().then(function(d) { msgEl.textContent = d.detail || 'Erro ao salvar'; msgEl.className = 'text-danger'; }); }
        }).catch(function() { msgEl.textContent = 'Erro de rede.'; msgEl.className = 'text-danger'; });
    });
    load();
})();
</script>
{% endblock %}

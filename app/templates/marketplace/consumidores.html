{% extends "base.html" %}

{% block title %}Consumidores | Marketplace{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="mb-3 d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">Consumidores (marketplace)</h1>
        <a href="/negocio/marketplace" class="btn btn-outline-secondary">Voltar</a>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Estabelecimento (tenant_id)</label>
                <input type="number" class="form-control form-control-sm w-auto d-inline-block" id="filter-tenant" placeholder="Opcional">
                <select class="form-select form-select-sm w-auto d-inline-block ms-2" id="filter-tipo">
                    <option value="">Todos os tipos</option>
                    <option value="GUEST">GUEST</option>
                    <option value="REGISTERED">REGISTERED</option>
                </select>
                <button type="button" class="btn btn-sm btn-primary ms-2" id="btn-buscar">Buscar</button>
            </div>
            <div class="table-responsive">
                <table class="table table-sm table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tenant</th>
                            <th>E-mail</th>
                            <th>Nome</th>
                            <th>Tipo</th>
                            <th>Status</th>
                            <th>Marketing</th>
                            <th>Criado em</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <p class="text-muted small mb-0" id="total-msg">Carregue os consumidores.</p>
        </div>
    </div>
</div>
<script>
(function () {
  var tbody = document.getElementById("tbody");
  var totalMsg = document.getElementById("total-msg");
  var tenantId = {{ minha_loja_cliente_id or 'null' }};
  if (tenantId) document.getElementById("filter-tenant").value = tenantId;
  function load() {
    var tenant = document.getElementById("filter-tenant").value;
    var tipo = document.getElementById("filter-tipo").value;
    var params = new URLSearchParams();
    if (tenant) params.set("tenant_id", tenant);
    if (tipo) params.set("tipo_consumidor", tipo);
    params.set("limit", "100");
    fetch("/api/v1/marketplace/consumidores?" + params.toString(), { credentials: "include" })
      .then(function (r) {
        if (!r.ok) throw new Error("Erro ao carregar");
        return r.json();
      })
      .then(function (data) {
        tbody.innerHTML = "";
        (data.items || []).forEach(function (c) {
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + c.id + "</td><td>" + (c.tenant_id != null ? c.tenant_id : "-") + "</td><td>" + (c.email || "") + "</td><td>" + (c.nome || "") + "</td><td>" + (c.tipo_consumidor || "") + "</td><td>" + (c.status_cadastro || "") + "</td><td>" + (c.aceite_marketing ? "Sim" : "Não") + "</td><td>" + (c.created_at ? c.created_at.slice(0, 19) : "") + "</td>";
          tbody.appendChild(tr);
        });
        totalMsg.textContent = "Total: " + (data.total || 0) + " consumidor(es).";
      })
      .catch(function () {
        totalMsg.textContent = "Erro ao carregar. Verifique permissão (marketplace:visualizar).";
      });
  }
  document.getElementById("btn-buscar").addEventListener("click", load);
  load();
})();
</script>
{% endblock %}

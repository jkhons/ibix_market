{% extends "base.html" %}

{% block title %}Eventos de integração | Marketplace{% endblock %}

{% block content %}
<div class="container-fluid">
    <div class="mb-3 d-flex justify-content-between align-items-center">
        <h1 class="h3 mb-0">Eventos de integração (CRM)</h1>
        <a href="/negocio/marketplace" class="btn btn-outline-secondary">Voltar</a>
    </div>
    <div class="card">
        <div class="card-body">
            <div class="mb-3">
                <label class="form-label">Estabelecimento (tenant_id)</label>
                <input type="number" class="form-control form-control-sm w-auto d-inline-block" id="filter-tenant" placeholder="Opcional">
                <input type="text" class="form-control form-control-sm w-auto d-inline-block ms-2" id="filter-event" placeholder="event_name">
                <select class="form-select form-select-sm w-auto d-inline-block ms-2" id="filter-status">
                    <option value="">Todos</option>
                    <option value="pending">pending</option>
                    <option value="processed">processed</option>
                </select>
                <button type="button" class="btn btn-sm btn-primary ms-2" id="btn-buscar">Buscar</button>
            </div>
            <div class="table-responsive">
                <table class="table table-sm table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Tenant</th>
                            <th>Evento</th>
                            <th>Entidade</th>
                            <th>Entity ID</th>
                            <th>Status</th>
                            <th>Criado em</th>
                        </tr>
                    </thead>
                    <tbody id="tbody"></tbody>
                </table>
            </div>
            <p class="text-muted small mb-0" id="total-msg">Carregue os eventos.</p>
        </div>
    </div>
</div>
<script>
(function () {
  var tbody = document.getElementById("tbody");
  var totalMsg = document.getElementById("total-msg");
  var tenantId = {{ minha_loja_cliente_id or 'null' }};
  if (tenantId) document.getElementById("filter-tenant").value = tenantId;
  function load() {
    var params = new URLSearchParams();
    var tenant = document.getElementById("filter-tenant").value;
    var eventName = document.getElementById("filter-event").value;
    var status = document.getElementById("filter-status").value;
    if (tenant) params.set("tenant_id", tenant);
    if (eventName) params.set("event_name", eventName);
    if (status) params.set("status", status);
    params.set("limit", "100");
    fetch("/api/v1/marketplace/integracao/eventos?" + params.toString(), { credentials: "include" })
      .then(function (r) {
        if (!r.ok) throw new Error("Erro ao carregar");
        return r.json();
      })
      .then(function (data) {
        tbody.innerHTML = "";
        (data.items || []).forEach(function (e) {
          var tr = document.createElement("tr");
          tr.innerHTML = "<td>" + e.id + "</td><td>" + (e.tenant_id != null ? e.tenant_id : "") + "</td><td>" + (e.event_name || "") + "</td><td>" + (e.entity_type || "") + "</td><td>" + (e.entity_id || "") + "</td><td>" + (e.status || "") + "</td><td>" + (e.created_at ? e.created_at.slice(0, 19) : "") + "</td>";
          tbody.appendChild(tr);
        });
        totalMsg.textContent = "Total: " + (data.total || 0) + " evento(s).";
      })
      .catch(function () {
        totalMsg.textContent = "Erro ao carregar. Verifique permissão (marketplace:visualizar).";
      });
  }
  document.getElementById("btn-buscar").addEventListener("click", load);
  load();
})();
</script>
{% endblock %}

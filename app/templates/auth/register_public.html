<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Cadastro de empresa - Ibix">
	<meta name="author" content="Ibix">

	<link rel="shortcut icon" href="/static/img/icons/icon-48x48.png" />
	<title>Cadastro | Ibix</title>

	<link href="/static/css/dashboard.css" rel="stylesheet">
	<link href="/static/css/certipeso.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
	<main class="d-flex w-100">
		<div class="container d-flex flex-column">
			<div class="row min-vh-100 py-4">
				<div class="col-sm-10 col-md-9 col-lg-8 col-xl-6 mx-auto d-table">
					<div class="d-table-cell align-middle">
						<div class="text-center mt-2 mb-3">
							<h1 class="h2">Cadastre sua empresa</h1>
							<p class="lead">Cadastre sua empresa e comece a usar o Ibix.</p>
						</div>

						<div class="card">
							<div class="card-body">
								<div class="m-sm-3">
									<div id="alert-area"></div>
									<form id="cadastro-form">
										<h6 class="mb-2">Dados do responsável</h6>
										<div class="mb-2">
											<label class="form-label">Nome completo</label>
											<input class="form-control" type="text" name="nome" id="nome" placeholder="Seu nome" required />
										</div>
										<div class="mb-2">
											<label class="form-label">Email</label>
											<input class="form-control" type="email" name="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
										</div>
										<div class="row">
											<div class="col-md-6 mb-2">
												<label class="form-label">Senha</label>
												<input class="form-control" type="password" name="password" id="password" placeholder="Mín. 6 caracteres" required autocomplete="new-password" />
											</div>
											<div class="col-md-6 mb-2">
												<label class="form-label">Confirmar senha</label>
												<input class="form-control" type="password" name="confirm_password" id="confirm_password" placeholder="Repita a senha" required autocomplete="new-password" />
											</div>
										</div>

										<hr class="my-3" />
										<h6 class="mb-2">Dados da empresa</h6>
										<div class="mb-2">
											<label class="form-label">Nome da empresa</label>
											<input class="form-control" type="text" name="nome_empresa" id="nome_empresa" placeholder="Razão social" required />
										</div>
										<div class="mb-2">
											<label class="form-label">CNPJ</label>
											<input class="form-control" type="text" name="cnpj" id="cnpj" placeholder="00.000.000/0001-00" required />
										</div>
										<div class="mb-2">
											<label class="form-label">CEP (opcional)</label>
											<input class="form-control" type="text" name="cep" id="cep" placeholder="00000-000" />
										</div>
										<div class="mb-2">
											<label class="form-label">Endereço</label>
											<input class="form-control" type="text" name="endereco" id="endereco" placeholder="Rua, número, bairro" required />
										</div>
										<div class="row">
											<div class="col-md-6 mb-2">
												<label class="form-label">Cidade</label>
												<input class="form-control" type="text" name="cidade" id="cidade" required />
											</div>
											<div class="col-md-3 mb-2">
												<label class="form-label">UF</label>
												<input class="form-control" type="text" name="uf" id="uf" maxlength="2" placeholder="SP" required />
											</div>
										</div>
										<div class="mb-2">
											<label class="form-label">Contato (nome)</label>
											<input class="form-control" type="text" name="contato" id="contato" placeholder="Nome do contato" required />
										</div>
										<div class="mb-3">
											<label class="form-label">Telefone</label>
											<input class="form-control" type="text" name="telefone" id="telefone" placeholder="(11) 99999-9999" required />
										</div>
										<div class="mb-3">
											<label class="form-label">Código promocional (opcional)</label>
											<input class="form-control" type="text" name="codigo_promocional" id="codigo_promocional" placeholder="" maxlength="50" autocomplete="off" />
											<small class="text-muted d-block mt-1" id="codigo-msg"></small>
										</div>

										<div class="d-grid gap-2 mt-3">
											<button type="submit" class="btn btn-lg btn-primary" id="btn-cadastro">
												<span class="btn-text">Cadastrar</span>
												<span class="btn-loading d-none">
													<span class="spinner-border spinner-border-sm me-2"></span>
													Enviando...
												</span>
											</button>
										</div>
									</form>
								</div>
							</div>
						</div>
						<div class="text-center mt-3 mb-3">
							Já tem conta? <a href="/login">Entrar</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script src="/static/js/dashboard.js"></script>
	<script>
	(function() {
		var form = document.getElementById('cadastro-form');
		var alertArea = document.getElementById('alert-area');
		var btn = document.getElementById('btn-cadastro');

		function showAlert(type, msg) {
			var text = (msg && String(msg).trim()) ? String(msg).trim() : 'Erro ao cadastrar. Tente novamente.';
			alertArea.innerHTML = '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' + text + ' <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button></div>';
			alertArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
		}

		function setLoading(loading) {
			btn.disabled = loading;
			btn.querySelector('.btn-text').classList.toggle('d-none', loading);
			btn.querySelector('.btn-loading').classList.toggle('d-none', !loading);
		}

		var codigoInput = document.getElementById('codigo_promocional');
		var codigoMsg = document.getElementById('codigo-msg');
		var codigoDica = document.getElementById('codigo-dica');
		if (codigoInput && codigoMsg) {
			codigoInput.addEventListener('blur', function() {
				var v = this.value.trim();
				codigoMsg.textContent = '';
				codigoMsg.className = 'text-muted';
				if (codigoDica) codigoDica.style.display = '';
				if (!v) return;
				var url = '/api/v1/codigos-desconto/validar/' + encodeURIComponent(v.toUpperCase());
				fetch(url)
					.then(function(r) {
						if (r.ok) {
							codigoMsg.textContent = 'Código válido.';
							codigoMsg.className = 'text-success';
							if (codigoDica) codigoDica.style.display = 'none';
						} else {
							r.json().then(function(body) {
								var msg = (body && body.detail) ? (typeof body.detail === 'string' ? body.detail : (body.detail.msg || body.detail.message || 'Código não encontrado ou expirado.')) : 'Código não encontrado ou expirado. Verifique se digitou exatamente como recebeu.';
								codigoMsg.textContent = msg;
							}).catch(function() {
								codigoMsg.textContent = 'Código não encontrado ou expirado. Verifique se digitou exatamente como recebeu.';
							});
							codigoMsg.className = 'text-danger';
						}
					})
					.catch(function() {
						codigoMsg.textContent = 'Não foi possível validar o código. Tente novamente.';
						codigoMsg.className = 'text-danger';
						if (codigoDica) codigoDica.style.display = '';
					});
			});
		}

		form.addEventListener('submit', function(e) {
			e.preventDefault();
			var pwd = document.getElementById('password').value;
			var conf = document.getElementById('confirm_password').value;
			if (pwd !== conf) {
				showAlert('danger', 'As senhas não coincidem.');
				return;
			}
			setLoading(true);
			alertArea.innerHTML = '';
			var codigoPromoRaw = document.getElementById('codigo_promocional').value.trim() || null;
			var codigoPromo = codigoPromoRaw ? codigoPromoRaw.toUpperCase() : null;
			var payload = {
				nome: document.getElementById('nome').value.trim(),
				email: document.getElementById('email').value.trim(),
				password: pwd,
				confirm_password: conf,
				codigo_promocional: codigoPromo || null,
				nome_empresa: document.getElementById('nome_empresa').value.trim(),
				cnpj: document.getElementById('cnpj').value.trim().replace(/\D/g, ''),
				cep: document.getElementById('cep').value.trim() || null,
				endereco: document.getElementById('endereco').value.trim(),
				cidade: document.getElementById('cidade').value.trim(),
				uf: document.getElementById('uf').value.trim().toUpperCase(),
				contato: document.getElementById('contato').value.trim(),
				telefone: document.getElementById('telefone').value.trim()
			};
			// CNPJ: API espera string (pode ser formatada ou só números); backend formata
			if (payload.cnpj.length === 14) {
				payload.cnpj = payload.cnpj;
			}
			fetch('/api/v1/auth/register/public', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(payload)
			})
			.then(function(r) {
				if (r.ok) return r.json();
				return r.json()
					.catch(function() { return {}; })
					.then(function(d) {
						var msg = 'Erro ao cadastrar. Verifique se o e-mail ou CNPJ já não estão em uso.';
						if (d && d.detail !== undefined && d.detail !== null) {
							if (typeof d.detail === 'string') msg = d.detail;
							else if (d.detail && d.detail.message) msg = d.detail.message;
							else if (Array.isArray(d.detail) && d.detail.length) msg = d.detail.map(function(x) { return x.msg || (x.loc ? (x.loc.join('.') + ': ' + (x.msg || '')) : ''); }).filter(Boolean).join(' ');
							else if (d.detail && typeof d.detail === 'object') msg = d.detail.msg || JSON.stringify(d.detail);
							else msg = String(d.detail);
						}
						throw new Error(msg);
					});
			})
			.then(function(data) {
				showAlert('success', (data.message || 'Cadastro realizado!') + ' Redirecionando para o login...');
				// Redirecionar para o login no mesmo domínio (evitar host de login externo)
				var loginUrl = window.location.origin + '/login';
				setTimeout(function() { window.location.href = loginUrl; }, 2000);
			})
			.catch(function(err) {
				var msg = (err && err.message) ? err.message : 'Erro ao cadastrar. Verifique se o e-mail ou CNPJ já não estão em uso.';
				showAlert('danger', msg);
			})
			.finally(function() {
				setLoading(false);
			});
		});
	})();
	</script>
</body>

</html>

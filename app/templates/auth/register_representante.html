<!DOCTYPE html>
<html lang="pt-BR">

<head>
	<meta charset="utf-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge">
	<meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no">
	<meta name="description" content="Cadastro de representante - Ibix">
	<meta name="author" content="Ibix">

	<link rel="shortcut icon" href="/static/img/icons/icon-48x48.png" />
	<title>Cadastro Representante | Ibix</title>

	<link href="/static/css/dashboard.css" rel="stylesheet">
	<link href="/static/css/certipeso.css" rel="stylesheet">
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
</head>

<body>
	<main class="d-flex w-100">
		<div class="container d-flex flex-column">
			<div class="row min-vh-100 py-4">
				<div class="col-sm-10 col-md-9 col-lg-8 col-xl-6 mx-auto d-table">
					<div class="d-table-cell align-middle">
						<div class="text-center mt-2 mb-3">
							<h1 class="h2">Cadastre-se como representante</h1>
							<p class="lead">Crie sua conta e gerencie sua carteira de clientes no Ibix.</p>
						</div>

						<div class="card">
							<div class="card-body">
								<div class="m-sm-3">
									<div id="alert-area"></div>
									<form id="cadastro-form">
										<h6 class="mb-2">Dados do representante</h6>
										<div class="mb-2">
											<label class="form-label">Nome completo</label>
											<input class="form-control" type="text" name="nome" id="nome" placeholder="Seu nome" required />
										</div>
										<div class="mb-2">
											<label class="form-label">E-mail</label>
											<input class="form-control" type="email" name="email" id="email" placeholder="seu@email.com" required autocomplete="email" />
										</div>
										<div class="row">
											<div class="col-md-6 mb-2">
												<label class="form-label">Senha</label>
												<input class="form-control" type="password" name="password" id="password" placeholder="Mín. 6 caracteres" required autocomplete="new-password" />
											</div>
											<div class="col-md-6 mb-2">
												<label class="form-label">Confirmar senha</label>
												<input class="form-control" type="password" name="confirm_password" id="confirm_password" placeholder="Repita a senha" required autocomplete="new-password" />
											</div>
										</div>
										<div class="mb-3">
											<label class="form-label">Telefone (opcional)</label>
											<input class="form-control" type="text" name="telefone" id="telefone" placeholder="(11) 99999-9999" autocomplete="tel" />
										</div>

										<div class="d-grid gap-2 mt-3">
											<button type="submit" class="btn btn-lg btn-primary" id="btn-cadastro">
												<span class="btn-text">Cadastrar</span>
												<span class="btn-loading d-none">
													<span class="spinner-border spinner-border-sm me-2"></span>
													Enviando...
												</span>
											</button>
										</div>
									</form>
								</div>
							</div>
						</div>
						<div class="text-center mt-3 mb-3">
							Já tem conta? <a href="/login">Entrar</a>
							<span class="mx-2">|</span>
							<a href="/cadastro">Cadastro de empresa (Cliente Administrador)</a>
						</div>
					</div>
				</div>
			</div>
		</div>
	</main>

	<script src="/static/js/dashboard.js"></script>
	<script>
	(function() {
		var form = document.getElementById('cadastro-form');
		var alertArea = document.getElementById('alert-area');
		var btn = document.getElementById('btn-cadastro');

		function showAlert(type, msg) {
			var text = (msg && String(msg).trim()) ? String(msg).trim() : 'Erro ao cadastrar. Tente novamente.';
			alertArea.innerHTML = '<div class="alert alert-' + type + ' alert-dismissible fade show" role="alert">' + text + ' <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button></div>';
			alertArea.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
		}

		function setLoading(loading) {
			btn.disabled = loading;
			btn.querySelector('.btn-text').classList.toggle('d-none', loading);
			btn.querySelector('.btn-loading').classList.toggle('d-none', !loading);
		}

		form.addEventListener('submit', function(e) {
			e.preventDefault();
			var pwd = document.getElementById('password').value;
			var conf = document.getElementById('confirm_password').value;
			if (pwd !== conf) {
				showAlert('danger', 'As senhas não coincidem.');
				return;
			}
			setLoading(true);
			alertArea.innerHTML = '';
			var payload = {
				nome: document.getElementById('nome').value.trim(),
				email: document.getElementById('email').value.trim(),
				password: pwd,
				confirm_password: conf,
				telefone: document.getElementById('telefone').value.trim() || null
			};
			fetch('/api/v1/auth/register/representante', {
				method: 'POST',
				headers: { 'Content-Type': 'application/json' },
				body: JSON.stringify(payload)
			})
			.then(function(r) {
				if (r.ok) return r.json();
				return r.json()
					.catch(function() { return {}; })
					.then(function(d) {
						var msg = 'Erro ao cadastrar. Verifique se o e-mail já não está em uso.';
						if (d && d.detail !== undefined && d.detail !== null) {
							if (typeof d.detail === 'string') msg = d.detail;
							else if (d.detail && d.detail.message) msg = d.detail.message;
							else if (Array.isArray(d.detail) && d.detail.length) msg = d.detail.map(function(x) { return x.msg || (x.loc ? (x.loc.join('.') + ': ' + (x.msg || '')) : ''); }).filter(Boolean).join(' ');
							else if (d.detail && typeof d.detail === 'object') msg = d.detail.msg || JSON.stringify(d.detail);
							else msg = String(d.detail);
						}
						throw new Error(msg);
					});
			})
			.then(function(data) {
				showAlert('success', (data.message || 'Cadastro realizado!') + ' Redirecionando para o login...');
				var loginUrl = window.location.origin + '/login';
				setTimeout(function() { window.location.href = loginUrl; }, 2000);
			})
			.catch(function(err) {
				var msg = (err && err.message) ? err.message : 'Erro ao cadastrar. Verifique se o e-mail já não está em uso.';
				showAlert('danger', msg);
			})
			.finally(function() {
				setLoading(false);
			});
		});
	})();
	</script>
</body>

</html>

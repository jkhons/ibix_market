# Alembic Configuration - CertiPeso
# Run from project root: alembic upgrade head

[alembic]
script_location = app/database/migrations
prepend_sys_path = .
version_path_separator = os

# URL dinâmica: definida em env.py via get_database_url() (PostgreSQL por padrão).
# Fallback abaixo só quando env.py não é usado (ex.: modo offline).
sqlalchemy.url = postgresql+psycopg2://postgres:@localhost:5432/pdv_solumatica

[post_write_hooks]
# hooks = black
# black.type = console_scripts
# black.entrypoint = black
# black.options = -q

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S

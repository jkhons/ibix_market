# =============================================================================
# Zabbix Server — Docker Compose
# Rodar no SERVIDOR MONITOR (não no servidor ibix!)
#
# Uso:
#   mkdir -p /opt/zabbix && cp docker-compose.yml /opt/zabbix/
#   cd /opt/zabbix && docker compose up -d
#
# Acesso: http://IP-SERVIDOR-MONITOR:8080
# Login:  Admin / zabbix
# =============================================================================

services:
  # --- PostgreSQL (banco do Zabbix) ---
  zabbix-db:
    image: postgres:16-alpine
    container_name: zabbix-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-ZbxStr0ng!Pass2026}
    volumes:
      - zabbix-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zabbix"]
      interval: 10s
      timeout: 5s
      retries: 5

  # --- Zabbix Server ---
  zabbix-server:
    image: zabbix/zabbix-server-pgsql:ubuntu-7.2-latest
    container_name: zabbix-server
    restart: unless-stopped
    depends_on:
      zabbix-db:
        condition: service_healthy
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-ZbxStr0ng!Pass2026}
      ZBX_CACHESIZE: 128M
      ZBX_HISTORYCACHESIZE: 64M
      ZBX_STARTPOLLERS: 10
      ZBX_STARTPINGERS: 4
      ZBX_STARTHTTPPOLLERS: 5
      ZBX_STARTTRAPPERS: 5
    ports:
      - "10051:10051"
    volumes:
      - zabbix-server-alertscripts:/usr/lib/zabbix/alertscripts
      - zabbix-server-externalscripts:/usr/lib/zabbix/externalscripts

  # --- Zabbix Web (Frontend Nginx) ---
  zabbix-web:
    image: zabbix/zabbix-web-nginx-pgsql:ubuntu-7.2-latest
    container_name: zabbix-web
    restart: unless-stopped
    depends_on:
      - zabbix-server
      - zabbix-db
    environment:
      DB_SERVER_HOST: zabbix-db
      POSTGRES_DB: zabbix
      POSTGRES_USER: zabbix
      POSTGRES_PASSWORD: ${ZABBIX_DB_PASSWORD:-ZbxStr0ng!Pass2026}
      ZBX_SERVER_HOST: zabbix-server
      PHP_TZ: America/Sao_Paulo
      ZBX_SERVER_NAME: "Ibix Monitor"
    ports:
      - "8080:8080"

  # --- Grafana (opcional, dashboards avançados) ---
  grafana:
    image: grafana/grafana:latest
    container_name: zabbix-grafana
    restart: unless-stopped
    depends_on:
      - zabbix-server
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-GrafIbix2026!}
      GF_SERVER_ROOT_URL: http://localhost:3000
      GF_INSTALL_PLUGINS: alexanderzobnin-zabbix-app
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana

volumes:
  zabbix-db-data:
  zabbix-server-alertscripts:
  zabbix-server-externalscripts:
  grafana-data:

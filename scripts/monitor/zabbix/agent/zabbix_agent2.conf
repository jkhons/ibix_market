# =============================================================================
# Zabbix Agent 2 — Configuração para o servidor ibix (187.77.56.55)
# Arquivo: /etc/zabbix/zabbix_agent2.conf
# =============================================================================

# --- Conexão com Zabbix Server ---
# IMPORTANTE: Substitua IP_SERVIDOR_MONITOR pelo IP real do seu servidor Zabbix
Server=72.60.146.150
ServerActive=72.60.146.150

# --- Identificação deste host ---
Hostname=ibix-server
HostMetadata=linux ibix web saas

# --- Rede ---
ListenPort=10050
ListenIP=0.0.0.0

# --- Logs ---
LogType=system
# LogFile=/var/log/zabbix/zabbix_agent2.log
# LogFileSize=10

# --- Segurança ---
AllowKey=system.run[*]
DenyKey=system.run[rm *]
DenyKey=system.run[dd *]
DenyKey=system.run[mkfs*]
DenyKey=system.run[shutdown*]
DenyKey=system.run[reboot*]

# --- Timeouts ---
Timeout=15
ControlSocket=/tmp/agent.sock

# --- Buffer ---
BufferSend=5
BufferSize=200

# --- Plugins ---
Plugins.SystemRun.LogRemoteCommands=1

# --- UserParameters customizados (ibix) ---
Include=/etc/zabbix/zabbix_agent2.d/*.conf

# PDV Ibix - Nginx (www.ibix.com.br, HTTPS)
# Copiar para /etc/nginx/sites-available/solumatica.conf
# Certificados: certbot (Let's Encrypt) para www.ibix.com.br
# server_tokens: definido em nginx.conf global (evitar duplicar no contexto http)

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=password_reset_limit:10m rate=3r/m;

# Webhooks (ex.: Mercado Pago) assinam com x-request-id exatamente como enviado.
# Não substituir pelo $request_id do Nginx quando o cliente já enviou o header.
map $http_x_request_id $proxy_x_request_id {
    default $http_x_request_id;
    ""      $request_id;
}

upstream pdv_solumatica {
    server 127.0.0.1:8000;
    keepalive 32;
}

# HTTP -> HTTPS + redirect ibix.com.br -> www.ibix.com.br
server {
    listen 80;
    server_name ibix.com.br www.ibix.com.br;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }
    location / {
        return 301 https://www.ibix.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.ibix.com.br;

    ssl_certificate     /etc/letsencrypt/live/www.ibix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ibix.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    # Headers de segurança: CSP, X-Frame-Options, Referrer-Policy etc. são adicionados pelo FastAPI
    # (middleware add_security_headers em main.py). Aqui fica apenas HSTS (camada TLS).
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript application/xml text/xml;
    gzip_min_length 256;

    client_max_body_size 20M;

    # Emissão de nota fiscal (SEFAZ): pode levar 1–3 min; evita "Client closed request"
    location ~ ^/api/v1/(vendas/[0-9]+/emitir-nota|fiscal/notas-fiscais/[0-9]+/enviar)$ {
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 10s;
        proxy_send_timeout 180s;
        proxy_read_timeout 180s;
    }

    # Vitrine pública: não aplicar limit_req global aqui, pois os bursts de carregamento
    # (anuncios/categorias + refresh) geram 503 antes de chegar no FastAPI.
    location ^~ /api/v1/loja/ {
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_x_request_id;
        proxy_set_header Connection "";
    }

    # Login e forgot-password: rate limit agressivo contra brute force (5 req/min por IP).
    location = /api/v1/auth/login {
        limit_req zone=login_limit burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_x_request_id;
        proxy_set_header Connection "";
    }

    location = /api/v1/auth/forgot-password {
        limit_req zone=password_reset_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_x_request_id;
        proxy_set_header Connection "";
    }

    location = /api/v1/auth/redefinir-senha {
        limit_req zone=password_reset_limit burst=2 nodelay;
        limit_req_status 429;
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_x_request_id;
        proxy_set_header Connection "";
    }

    # Mantém proteção de rate limiting para demais APIs.
    location ^~ /api/ {
        limit_req zone=api_limit burst=60 nodelay;
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_x_request_id;
        proxy_set_header Connection "";
    }

    location / {
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $proxy_x_request_id;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /central_solumatica/pdv_solumatica/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://pdv_solumatica;
        proxy_set_header Host $host;
    }
}

# HTTPS sem www -> com www
server {
    listen 443 ssl;
    http2 on;
    server_name ibix.com.br;
    ssl_certificate     /etc/letsencrypt/live/www.ibix.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.ibix.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    return 301 https://www.ibix.com.br$request_uri;
}

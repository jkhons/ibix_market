# PDV SOLUMATICA - Nginx (pdv.automscale.com e pdv.automscale.com.br, HTTPS)
# Copiar para /etc/nginx/sites-available/pdv-automscale.conf
# Certificados: certbot (Let's Encrypt)

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream pdv_solumatica {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name pdv.automscale.com pdv.automscale.com.br;
    return 301 https://pdv.automscale.com.br$request_uri;
}

server {
    listen 443 ssl http2;
    server_name pdv.automscale.com pdv.automscale.com.br;

    ssl_certificate     /etc/letsencrypt/live/pdv.automscale.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/pdv.automscale.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript;
    gzip_min_length 256;

    client_max_body_size 20M;

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /central_solumatica/pdv_solumatica/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /metrics {
        proxy_pass http://pdv_solumatica;
        proxy_set_header Host $host;
    }
}

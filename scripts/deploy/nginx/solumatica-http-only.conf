# PDV SOLUMATICA — Nginx HTTP apenas (para primeira emissão Certbot)
# USAR APENAS ANTES DE OBTER OS CERTIFICADOS SSL.
# Após: certbot e depois ativar solumatica.conf (HTTPS). Domínio: ibix.com.br / www.ibix.com.br
# server_tokens: definido em nginx.conf global (evitar duplicar no contexto http)

limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;

upstream pdv_solumatica {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name ibix.com.br www.ibix.com.br;

    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }

    location / {
        limit_req zone=api_limit burst=20 nodelay;
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /central_solumatica/pdv_solumatica/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /metrics {
        proxy_pass http://pdv_solumatica;
        proxy_set_header Host $host;
    }
}

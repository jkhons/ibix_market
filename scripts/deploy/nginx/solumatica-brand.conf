# PDV Ibix — Nginx HTTPS para marca Solumática (multi-brand Fase 5)
# Copiar para /etc/nginx/sites-available/solumatica-brand.conf e incluir no deploy.
# Certificados: /etc/letsencrypt/live/solumatica.com.br/
# Upstream pdv_solumatica: definido em solumatica.conf (mesmo arquivo sites-enabled).

# HTTP → HTTPS (Solumática)
server {
    listen 80;
    server_name solumatica.com.br www.solumatica.com.br;
    location /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        allow all;
    }
    location / {
        return 301 https://www.solumatica.com.br$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.solumatica.com.br;

    ssl_certificate     /etc/letsencrypt/live/solumatica.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solumatica.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    client_max_body_size 20M;

    location / {
        proxy_pass http://pdv_solumatica;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
    }

    location /static/ {
        alias /central_solumatica/pdv_solumatica/app/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    location /metrics {
        allow 127.0.0.1;
        allow ::1;
        deny all;
        proxy_pass http://pdv_solumatica;
        proxy_set_header Host $host;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name solumatica.com.br;
    ssl_certificate     /etc/letsencrypt/live/solumatica.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/solumatica.com.br/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    return 301 https://www.solumatica.com.br$request_uri;
}
